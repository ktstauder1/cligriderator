<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2538"/>
      <stop offset="1" stop-color="#110e16"/>
    </linearGradient>
    <radialGradient id="halo" cx="64" cy="60" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8b23a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e8b23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="17" y1="17" x2="47" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6a1"/>
      <stop offset="0.3" stop-color="#e8b23a"/>
      <stop offset="0.6" stop-color="#b17624"/>
      <stop offset="0.82" stop-color="#d9834a"/>
      <stop offset="1" stop-color="#8a5220"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff6d8" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a1f08" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221c2c"/>
      <stop offset="1" stop-color="#0c0a10"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#235b56"/>
      <stop offset="1" stop-color="#0f2a29"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#e8b23a"/>
      <stop offset="1" stop-color="#6e3f15"/>
    </radialGradient>
    <!-- Ends on the sheen's diagonal edge, so the edge fades to nothing. -->
    <linearGradient id="sheen" x1="17" y1="17" x2="53.5" y2="62.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
    <clipPath id="frame-clip">
      <rect x="17" y="17" width="94" height="94" rx="15"/>
    </clipPath>
  </defs>

  <!-- Tile: plum night with a warm glow behind the lattice. -->
  <rect x="10" y="13" width="108" height="108" rx="26" fill="#000" opacity="0.4" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <circle cx="64" cy="60" r="60" fill="url(#halo)" clip-path="url(#tile-clip)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="25.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Brass lattice: the ▦ from the wordmark, 3 x 3 panes. -->
  <rect x="17" y="19.5" width="94" height="94" rx="15" fill="#000" opacity="0.55" filter="url(#drop)"/>
  <rect x="17" y="17" width="94" height="94" rx="15" fill="url(#brass)"/>
  <rect x="17.75" y="17.75" width="92.5" height="92.5" rx="14.25" fill="none"
        stroke="url(#bevel)" stroke-width="1.5"/>

  <!-- Panes: dark glass, the focused one lit teal. -->
  <g fill="url(#glass)" stroke="#2a1606" stroke-opacity="0.7">
    <rect x="22" y="22" width="26" height="26" rx="5"/>
    <rect x="51" y="22" width="26" height="26" rx="5"/>
    <rect x="80" y="22" width="26" height="26" rx="5"/>
    <rect x="22" y="51" width="26" height="26" rx="5"/>
    <rect x="80" y="51" width="26" height="26" rx="5"/>
    <rect x="22" y="80" width="26" height="26" rx="5"/>
    <rect x="51" y="80" width="26" height="26" rx="5"/>
    <rect x="80" y="80" width="26" height="26" rx="5"/>
  </g>
  <rect x="51" y="51" width="26" height="26" rx="5" fill="url(#lit)"/>
  <rect x="51" y="51" width="26" height="26" rx="5" fill="none" stroke="#4fb8ad"
        stroke-width="4" opacity="0.85" filter="url(#glow)"/>
  <rect x="51.75" y="51.75" width="24.5" height="24.5" rx="4.25" fill="none"
        stroke="#7ad6cb" stroke-width="1.5"/>

  <!-- Prompts, tinted from the house palette. -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="28.5,30.5 34,35 28.5,39.5" stroke="#8fb0f0"/>
    <line x1="36.5" y1="39.5" x2="42" y2="39.5" stroke="#8fb0f0" stroke-opacity="0.55"/>
    <polyline points="57.5,30.5 63,35 57.5,39.5" stroke="#d99ac4"/>
    <line x1="65.5" y1="39.5" x2="71" y2="39.5" stroke="#d99ac4" stroke-opacity="0.55"/>
    <polyline points="86.5,30.5 92,35 86.5,39.5" stroke="#7ad6cb"/>
    <line x1="94.5" y1="39.5" x2="100" y2="39.5" stroke="#7ad6cb" stroke-opacity="0.55"/>
    <polyline points="28.5,59.5 34,64 28.5,68.5" stroke="#96c76a"/>
    <line x1="36.5" y1="68.5" x2="42" y2="68.5" stroke="#96c76a" stroke-opacity="0.55"/>
    <polyline points="86.5,59.5 92,64 86.5,68.5" stroke="#f2776a"/>
    <line x1="94.5" y1="68.5" x2="100" y2="68.5" stroke="#f2776a" stroke-opacity="0.55"/>
    <polyline points="28.5,88.5 34,93 28.5,97.5" stroke="#eda06a"/>
    <line x1="36.5" y1="97.5" x2="42" y2="97.5" stroke="#eda06a" stroke-opacity="0.55"/>
    <polyline points="57.5,88.5 63,93 57.5,97.5" stroke="#f5c85c"/>
    <line x1="65.5" y1="97.5" x2="71" y2="97.5" stroke="#f5c85c" stroke-opacity="0.55"/>
    <polyline points="86.5,88.5 92,93 86.5,97.5" stroke="#8fb0f0"/>
    <line x1="94.5" y1="97.5" x2="100" y2="97.5" stroke="#8fb0f0" stroke-opacity="0.55"/>
    <polyline points="57.5,59.5 63,64 57.5,68.5" stroke="#e6f7f4"/>
  </g>
  <rect x="65.5" y="59.5" width="6" height="9" rx="1" fill="#f5c85c" opacity="0.8" filter="url(#glow)"/>
  <rect x="65.5" y="59.5" width="6" height="9" rx="1" fill="#f5c85c"/>

  <!-- Rivets where the bars cross, and a glass sheen over the lattice. -->
  <g fill="url(#rivet)" stroke="#4a2a0e" stroke-opacity="0.7" stroke-width="0.6">
    <circle cx="49.5" cy="49.5" r="3"/>
    <circle cx="78.5" cy="49.5" r="3"/>
    <circle cx="49.5" cy="78.5" r="3"/>
    <circle cx="78.5" cy="78.5" r="3"/>
  </g>
  <path d="M17 17 H111 L17 92 Z" fill="url(#sheen)" clip-path="url(#frame-clip)"/>
</svg>
