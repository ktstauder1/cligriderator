<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 24px variant: 2px brass rim, 1px bars, 4px panes, all on whole pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2538"/>
      <stop offset="1" stop-color="#110e16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c85c"/>
      <stop offset="0.55" stop-color="#d49a33"/>
      <stop offset="1" stop-color="#a8682a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="5.5" fill="url(#tile)"/>
  <rect x="3" y="3" width="18" height="18" rx="3" fill="url(#brass)"/>
  <g fill="#15111b">
    <rect x="5" y="5" width="4" height="4"/>
    <rect x="10" y="5" width="4" height="4"/>
    <rect x="15" y="5" width="4" height="4"/>
    <rect x="5" y="10" width="4" height="4"/>
    <rect x="15" y="10" width="4" height="4"/>
    <rect x="5" y="15" width="4" height="4"/>
    <rect x="10" y="15" width="4" height="4"/>
    <rect x="15" y="15" width="4" height="4"/>
  </g>
  <rect x="10" y="10" width="4" height="4" fill="#4fb8ad"/>
</svg>
