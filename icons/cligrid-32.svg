<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 32px variant: 2px brass rim, 1px bars, 6px panes, all on whole pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2538"/>
      <stop offset="1" stop-color="#110e16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c85c"/>
      <stop offset="0.55" stop-color="#d49a33"/>
      <stop offset="1" stop-color="#a8682a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#tile)"/>
  <rect x="4" y="4" width="24" height="24" rx="4" fill="url(#brass)"/>
  <g fill="#15111b">
    <rect x="6" y="6" width="6" height="6" rx="1"/>
    <rect x="13" y="6" width="6" height="6" rx="1"/>
    <rect x="20" y="6" width="6" height="6" rx="1"/>
    <rect x="6" y="13" width="6" height="6" rx="1"/>
    <rect x="20" y="13" width="6" height="6" rx="1"/>
    <rect x="6" y="20" width="6" height="6" rx="1"/>
    <rect x="13" y="20" width="6" height="6" rx="1"/>
    <rect x="20" y="20" width="6" height="6" rx="1"/>
  </g>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#2f8a81"/>
  <rect x="15" y="14" width="2" height="4" fill="#f5c85c"/>
  <rect x="7" y="8" width="3" height="1" fill="#8fb0f0"/>
  <rect x="14" y="8" width="3" height="1" fill="#d99ac4"/>
  <rect x="21" y="8" width="3" height="1" fill="#7ad6cb"/>
  <rect x="7" y="15" width="3" height="1" fill="#96c76a"/>
  <rect x="21" y="15" width="3" height="1" fill="#f2776a"/>
  <rect x="7" y="22" width="3" height="1" fill="#eda06a"/>
  <rect x="14" y="22" width="3" height="1" fill="#f5c85c"/>
  <rect x="21" y="22" width="3" height="1" fill="#8fb0f0"/>
</svg>
